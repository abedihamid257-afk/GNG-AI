<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GNG AI | هوش مصنوعی ایرانی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<header class="header">
    <div class="header-brand">
        <div class="header-logo">🤖</div>
        <div>
            <h1>GNG AI</h1>
            <p class="header-sub">هوش مصنوعی ایرانی | نسخه ۲.۸</p>
        </div>
    </div>
    <button class="menu-btn" id="menuBtn">☰</button>
</header>

<!-- منوی همبرگری -->
<div class="menu-overlay" id="menuOverlay"></div>
<div class="menu-panel" id="menuPanel">
    <button class="menu-close" id="menuClose">✕</button>
    <h3>📋 منو</h3>
    <a href="https://rubika.ir/admin10blue" target="_blank" rel="noopener" class="mbtn mbtn-admin">👤 ادمین</a>
    <a href="https://rubika.ir/GrahamBot" target="_blank" rel="noopener" class="mbtn mbtn-bot">🤖 بات</a>
    <a href="https://rubika.ir/Gameing019" target="_blank" rel="noopener" class="mbtn mbtn-channel">📢 کانال</a>
    <a href="https://ttr.ir/ads019" target="_blank" rel="noopener" class="mbtn mbtn-ads">📢 تبلیغات</a>
</div>

<main class="messages" id="messages">
    <div class="empty-state" id="emptyState">
        <div><span class="empty-icon">🤖</span><p>از GNG AI بپرس...</p><p class="empty-hint">سوالات علمی، برنامه‌نویسی، ترجمه و بیشتر</p></div>
    </div>
    <div class="typing" id="typing">🤖 GNG AI در حال نوشتن...</div>
</main>

<footer class="input-area">
    <input type="text" class="chat-input" id="userInput" placeholder="سوال خود را بنویسید..." autocomplete="off">
    <button class="send-btn" id="sendBtn">🚀</button>
</footer>

<button class="clear-btn" id="clearBtn">🗑️ پاک کردن تاریخچه</button>

<div class="version">GNG AI v2.8 | Graham Team</div>

<script src="script.js"></script>
</body>
</html>
