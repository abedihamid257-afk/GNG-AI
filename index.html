<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GNG AI | هوش مصنوعی ایرانی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-brand">
        <div class="header-logo">🤖</div>
        <div>
            <h1>GNG AI</h1>
            <p class="header-sub">هوش مصنوعی ایرانی</p>
        </div>
    </div>
    <nav class="header-btns">
        <a href="https://rubika.ir/admin10blue" target="_blank" rel="noopener" class="hbtn hbtn-admin">👤 ادمین</a>
        <a href="https://rubika.ir/GrahamBot" target="_blank" rel="noopener" class="hbtn hbtn-bot">🤖 بات</a>
        <a href="https://rubika.ir/Gameing019" target="_blank" rel="noopener" class="hbtn hbtn-channel">📢 کانال</a>
        <a href="https://ttr.ir/ads019" target="_blank" rel="noopener" class="hbtn hbtn-ads">📢 تبلیغات</a>
    </nav>
</header>

<!-- MESSAGES -->
<main class="messages" id="messages">
    <div class="empty-state" id="emptyState">
        <div class="empty-icon">🤖</div>
        <p>از GNG AI بپرس...</p>
        <p class="empty-hint">سوالات علمی، برنامه‌نویسی، ترجمه و بیشتر</p>
    </div>
    <div class="typing" id="typing">🤖 GNG AI در حال نوشتن...</div>
</main>

<!-- INPUT -->
<footer class="input-area">
    <input type="text" id="userInput" class="chat-input" placeholder="سوال خود را بنویسید..." autocomplete="off">
    <button id="sendBtn" class="send-btn" aria-label="ارسال">🚀</button>
</footer>

<button class="clear-btn" id="clearBtn">🗑️ پاک کردن تاریخچه</button>

<!-- MOBILE MENU -->
<nav class="mobile-menu">
    <a href="https://rubika.ir/admin10blue" target="_blank" rel="noopener" class="hbtn hbtn-admin">👤 ادمین</a>
    <a href="https://rubika.ir/GrahamBot" target="_blank" rel="noopener" class="hbtn hbtn-bot">🤖 بات</a>
    <a href="https://rubika.ir/Gameing019" target="_blank" rel="noopener" class="hbtn hbtn-channel">📢 کانال</a>
    <a href="https://ttr.ir/ads019" target="_blank" rel="noopener" class="hbtn hbtn-ads">📢 تبلیغات</a>
</nav>

<script src="script.js"></script>
</body>
</html>
